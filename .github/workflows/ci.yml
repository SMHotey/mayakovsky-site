name: CI

# Проверки без выкладки: каждая ветка и каждый pull request.
# На master/main проверки идут внутри deploy.yml, поэтому здесь эти ветки исключены.

on:
  push:
    branches-ignore: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Сборка и проверки (строгий режим)
        run: npm run verify:strict
