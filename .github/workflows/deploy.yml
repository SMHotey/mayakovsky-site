name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  schedule:
    # Ежедневная пересборка в 06:30 МСК: публикации с датой «сегодня» выходят сами
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Сборка и проверки
        run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Индексация — только после выкладки: иначе поисковики получают адреса,
  # которых на сайте ещё нет. Падение шага не отменяет уже сделанный деплой.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Пересборка (нужен список адресов страниц)
        run: node scripts/build.mjs
      - name: IndexNow — отправка правленых адресов Яндексу и Bing
        run: node scripts/indexnow.mjs --recent 2
